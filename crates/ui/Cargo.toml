[package]
name = "ui"
version.workspace = true
edition = "2024"
license.workspace = true
publish.workspace = true

[[bin]]
name = "nanti"
path = "src/main.rs"

[dependencies]
app = { path = "../app" }
editor-core = { path = "../editor-core" }
git = { path = "../git" }
gpui = "=0.2.2"
serde_json.workspace = true
syntax = { path = "../syntax" }
terminal = { path = "../terminal" }
url = "=2.5.8"
wry = "=0.57.1"

[features]
default = ["discord"]
# Discord Rich Presence; `--no-default-features` builds without it.
discord = []

[build-dependencies]
embed-resource = "=3.0.12"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[lints]
workspace = true
