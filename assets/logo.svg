<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="50%" stop-color="#0c0e17"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b4866" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1f2533" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#111520" stop-opacity="0.8"/>
    </linearGradient>

    <!-- N Glyph Primary Gradient -->
    <linearGradient id="n-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#d6e0f0"/>
      <stop offset="70%" stop-color="#8ba2c4"/>
      <stop offset="100%" stop-color="#4e6587"/>
    </linearGradient>

    <!-- Diagonal Slash Gradient (Code speed cut) -->
    <linearGradient id="slash-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Accent Period Dot Glow -->
    <linearGradient id="dot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <filter id="dot-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="n-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2.5"/>

  <!-- Inner Ambient Glow Ring -->
  <rect x="25" y="25" width="462" height="462" rx="107" ry="107" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1.5"/>

  <!-- Iconic 'N' Glyph (With code bracket / prompt geometry) -->
  <g filter="url(#n-shadow)">
    <!-- Left Pillar (Column / Buffer) -->
    <path d="M 124 130
             C 124 121 131 114 140 114
             L 168 114
             C 177 114 184 121 184 130
             L 184 372
             C 184 381 177 388 168 388
             L 140 388
             C 131 388 124 381 124 372
             Z"
          fill="url(#n-grad)"/>

    <!-- Sharp Diagonal Slash (High-velocity code cut) -->
    <path d="M 174 134
             L 326 352
             C 331 360 341 364 350 361
             L 358 358
             L 358 320
             L 204 118
             C 197 110 185 110 178 116
             Z"
          fill="url(#slash-grad)"/>

    <!-- Right Pillar (Offset above the signature dot) -->
    <path d="M 328 130
             C 328 121 335 114 344 114
             L 372 114
             C 381 114 388 121 388 130
             L 388 304
             C 388 313 381 320 372 320
             L 344 320
             C 335 320 328 313 328 304
             Z"
          fill="url(#n-grad)"/>
  </g>

  <!-- The Iconic Period Dot of 'nanti.' (Now, Not later) -->
  <circle cx="366" cy="374" r="22" fill="#38bdf8" opacity="0.35" filter="url(#dot-glow)"/>
  <circle cx="366" cy="374" r="18" fill="url(#dot-grad)" filter="url(#dot-glow)"/>
  <circle cx="363" cy="370" r="6" fill="#e0f2fe" opacity="0.9"/>
</svg>
