[workspace]
resolver = "2"
members = ["crates/editor-core", "crates/app", "crates/ui-spike", "crates/ui"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
ropey = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
